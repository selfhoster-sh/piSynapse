[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "piSynapse"
version = "1.0.0"
description = "Personal AI assistant — offline-first, multi-lingual, tool-calling"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "caldav>=1.3.0",
    "vobject>=0.9.6.1",
    "fastembed>=0.3.0",
    "numpy>=1.24.0",
    "piper-tts>=1.2.0",
    "icalendar>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_any_unimported = false
warn_return_any = false
warn_unused_ignores = true
exclude = ["venv/", "__pycache__/", "models/"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D200", "D210", "D400", "D401", "D402", "D404", "D405", "D406", "D407", "D408", "D409", "D410", "D411", "D412", "D413", "D414", "D415", "D416", "D417"]
