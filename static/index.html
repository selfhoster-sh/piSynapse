<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="piSynapse">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="manifest" href="/static/manifest.json">
<title>piSynapse</title>
<style>
@font-face{font-family:'DM Sans';font-style:normal;font-weight:400 700;font-display:swap;src:url('/static/fonts/dm-sans-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:400 700;font-display:swap;src:url('/static/fonts/dm-sans-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#0a0a0f; --surface:#111116; --surface2:#1a1a22; --surface3:#26262f;
  --border:#1e1e2a; --accent:#f0943a; --accent-d:rgba(240,148,58,.12);
  --accent-h:#e08020; --text:#e2e2e8; --text2:#8a8a9e; --text3:#5e5e72;
  --text4:#404056; --user-bg:#1a1a22; --danger:#e05555; --success:#4ecb71;
  --r:16px; --r-sm:10px; --r-chat:18px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.2);
  --shadow-md:0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 12px 40px rgba(0,0,0,.45);
}
.theme-blue{
  --accent:#4d9ff5; --accent-d:rgba(77,159,245,.12); --accent-h:#358de8;
}
.theme-green{
  --accent:#3dbf65; --accent-d:rgba(61,191,101,.12); --accent-h:#2ea855;
}
.theme-purple{
  --accent:#9578f5; --accent-d:rgba(149,120,245,.12); --accent-h:#8060e8;
}
.theme-red{
  --accent:#f05555; --accent-d:rgba(240,85,85,.12); --accent-h:#e03838;
}

html,body{height:100%;height:100svh;overflow:hidden;padding:0;margin:0}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);display:flex;font-size:14.5px;line-height:1.6;
  -webkit-text-size-adjust:100%;height:100%;font-feature-settings:'cv02','cv03','cv04','cv11';
  overflow-x:hidden;font-weight:500}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--text4)}

/* ── Sidebar ──────────────────────────────────────────────────────────────── */
#sidebar{width:264px;min-width:264px;height:100%;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:fixed;left:0;top:0;z-index:60;
  transition:transform .3s cubic-bezier(.4,0,.2,1)}
.sb-head{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.sb-top-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sb-brand-text{font-size:13px;font-weight:700;letter-spacing:1px;color:var(--text2);text-transform:uppercase}
.logo-controls{display:flex;align-items:center;gap:4px}
.icon-btn{background:none;border:none;color:var(--text3);cursor:pointer;
  padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  transition:all .2s;font-family:inherit}
.icon-btn:hover{color:var(--text);background:var(--surface2)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);
  transition:background .3s;flex-shrink:0;margin-left:4px}
.status-dot.thinking{background:var(--accent);animation:pulse 1s cubic-bezier(.4,0,.6,1) infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

.new-btn{width:100%;padding:10px 14px;background:var(--text);border:none;
  border-radius:var(--r-sm);color:var(--bg);font-size:13.5px;font-weight:600;
  cursor:pointer;text-align:left;font-family:inherit;
  transition:transform .15s,opacity .15s;display:flex;align-items:center;gap:8px}
.new-btn:hover{opacity:.9}
.new-btn:active{transform:scale(.98)}

#sidebar-scroll-container{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:10px}
.sb-label{padding:14px 16px 6px;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--text4)}

#session-list{padding:4px 8px;transition:max-height .3s cubic-bezier(.4,0,.2,1);flex:1}
#session-list.compressed-list{max-height:115px;overflow-y:auto;flex:none;
  border-bottom:1px solid var(--border);padding-bottom:8px}

.sess-item{display:flex;align-items:center;gap:8px;padding:9px 10px;margin-bottom:2px;
  border-radius:var(--r-sm);cursor:pointer;transition:all .2s;border:1px solid transparent}
.sess-item:hover{background:var(--surface2)}
.sess-item.active{background:var(--accent-d);border-color:rgba(124,108,240,.25);
  box-shadow:inset 3px 0 0 var(--accent)}
.sess-item.active .sess-name{color:var(--accent);font-weight:600}

.sess-name{flex:1;font-size:13.5px;color:var(--text2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.sess-time{font-size:11px;color:var(--text4);flex-shrink:0}
.sess-del{display:none;background:none;border:none;color:var(--text3);
  cursor:pointer;padding:4px;border-radius:4px;flex-shrink:0;line-height:1}
.sess-item:hover .sess-del{display:flex}
.sess-del:hover{color:var(--danger);background:rgba(224,85,85,.1)}

#sidebar-mem-section{display:none;animation:fadeIn .2s ease}
#sidebar-mem-list{display:none;flex-direction:column;gap:6px;padding:4px 8px;
  flex:1;overflow-y:auto;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.sb-footer{border-top:1px solid var(--border);padding:10px 10px 16px;
  display:flex;flex-direction:column;gap:6px}
.mem-btn,.settings-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:none;border:none;color:var(--text2);font-size:13.5px;cursor:pointer;
  border-radius:var(--r-sm);transition:all .2s;font-family:inherit;font-weight:500}
.mem-btn:hover,.settings-btn:hover{background:var(--surface2);color:var(--text)}
.mem-btn.active{background:var(--surface2);color:var(--accent)}
.settings-btn{color:var(--text3)}
.settings-btn:hover{color:var(--text);background:var(--surface2)}

#ticker,#top-ticker{transition:opacity .4s ease}
#ticker{height:36px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-sm);display:flex;align-items:center;overflow:hidden;position:relative}
.marquee-container{width:100%;overflow:hidden;display:flex;align-items:center}
.marquee-content{display:inline-flex;white-space:nowrap}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ── Main Area ─────────────────────────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;position:relative;
  margin-left:264px;transition:margin-left .3s cubic-bezier(.4,0,.2,1);
  padding-bottom:env(safe-area-inset-bottom,0px)}

#topbar{height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);flex-shrink:0;
  background:rgba(10,10,15,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  position:absolute;top:0;width:100%;z-index:20}

#logo-btn{background:transparent;border:none;cursor:pointer;padding:6px;border-radius:10px;
  display:flex;align-items:center;margin-right:8px;transition:background .2s;outline:none}
#logo-btn:hover{background:var(--surface2)}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent-h));
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:#000;flex-shrink:0;box-shadow:0 2px 10px var(--accent-d);
  transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#logo-btn:hover .logo-icon{transform:scale(1.15) rotate(10deg)}

#sess-title{flex:1;font-size:14px;font-weight:600;color:var(--text2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#topbar-right-widgets{display:none;align-items:center;gap:10px;animation:fadeIn .2s ease}
#top-ticker{height:32px;padding:0 4px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-sm);display:flex;align-items:center;width:220px;overflow:hidden}
.top-new-btn{background:var(--text);border:none;border-radius:var(--r-sm);color:var(--bg);
  font-size:12.5px;font-weight:600;padding:6px 12px;cursor:pointer;
  display:flex;align-items:center;gap:4px;font-family:inherit;transition:opacity .15s}
.top-new-btn:hover{opacity:.9}

/* ── Messages ──────────────────────────────────────────────────────────────── */
#messages{flex:1;overflow-y:auto;padding:80px 20px 160px;display:flex;
  flex-direction:column;scroll-behavior:smooth}
.msg-group{display:flex;flex-direction:column;margin-bottom:24px;max-width:800px;
  width:100%;margin-left:auto;margin-right:auto}
.msg-group.user{align-items:flex-end}
.msg-group.assistant{align-items:flex-start}
.msg-meta{display:flex;align-items:center;gap:8px;padding:0 4px;margin-bottom:6px}
.msg-meta .who{font-size:13px;font-weight:600;color:var(--text)}
.msg-group.assistant .msg-meta .who{color:var(--accent)}
.msg-meta .ts{font-size:11px;color:var(--text4)}

.bubble{max-width:100%;padding:14px 18px;border-radius:var(--r-chat);font-size:14.5px;
  line-height:1.7;word-break:break-word;box-shadow:var(--shadow-sm)}
.msg-group.user .bubble{background:var(--user-bg);border:1px solid var(--border);
  border-bottom-right-radius:4px;color:var(--text)}
.msg-group.assistant .bubble{background:transparent;padding:0;box-shadow:none;
  max-width:100%;width:100%}

/* Markdown, code, LaTeX */
.bubble p{margin-bottom:12px}.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{padding-left:24px;margin-bottom:12px}
.bubble li{margin-bottom:4px}
.bubble-images{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.bubble-images img{max-width:240px;max-height:240px;border-radius:10px;cursor:pointer;
  border:1px solid var(--border);object-fit:cover}
.drag-overlay{position:fixed;inset:0;background:rgba(10,10,15,.85);z-index:999;
  display:none;align-items:center;justify-content:center;
  border:3px dashed var(--accent);margin:12px;border-radius:var(--r)}
.drag-overlay.active{display:flex}
.drag-overlay-text{color:var(--accent);font-size:18px;font-weight:600}
.bubble code{background:var(--surface2);padding:2px 6px;border-radius:6px;
  font-family:'JetBrains Mono','Fira Code',monospace;font-size:13px;color:var(--accent)}
.math-inline{font-family:'Cambria Math','Times New Roman',serif;font-weight:500;
  color:var(--accent);padding:0 4px}
.math-display{display:flex;justify-content:center;margin:12px 0;
  font-family:'Cambria Math','Times New Roman',serif;font-weight:500;
  font-size:16px;color:var(--text)}

.code-wrapper{background:var(--surface);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;margin:12px 0}
.code-wrapper pre{margin:0;border:none;border-radius:0;background:transparent;overflow:hidden}
.code-header{display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border)}
.code-header .lang{font-size:11px;font-family:monospace;color:var(--text3);
  text-transform:uppercase;font-weight:600}
.code-header .copy-btn{background:none;border:none;color:var(--text3);font-size:11px;
  cursor:pointer;font-family:inherit;transition:color .2s;display:flex;
  align-items:center;gap:4px}
.code-header .copy-btn:hover{color:var(--text)}
.bubble pre code{display:block;padding:14px;overflow-x:auto;background:none;
  color:var(--text2);font-size:13.5px;border-radius:0}

.bubble h1,.bubble h2,.bubble h3{margin:16px 0 8px;font-weight:700;color:var(--text);
  letter-spacing:-.3px}
.bubble h1{font-size:20px}.bubble h2{font-size:18px}.bubble h3{font-size:16px}
.bubble a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;
  transition:border-color .2s}
.bubble a:hover{border-color:var(--accent)}
.bubble strong{font-weight:700;color:var(--text)}
.bubble blockquote{border-left:3px solid var(--accent);padding-left:14px;
  color:var(--text2);margin:10px 0;font-style:italic}
.table-wrapper{overflow-x:auto;margin:12px 0;border-radius:10px;border:1px solid var(--border)}
.bubble table{border-collapse:collapse;width:100%;margin:0;font-size:13.5px}
.bubble th,.bubble td{border:1px solid var(--border);padding:8px 12px;text-align:left;white-space:nowrap}
.bubble th{background:var(--surface2);font-weight:600;color:var(--text)}
.bubble td{color:var(--text2)}
.bubble tbody tr:nth-child(even) td{background:rgba(255,255,255,.02)}

.typing{display:flex;align-items:center;gap:6px;padding:12px 0;width:fit-content}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--accent);
  animation:bounce .8s infinite alternate}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%{transform:translateY(0);opacity:.4}100%{transform:translateY(-6px);opacity:1}}

.welcome{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:40px 24px;text-align:center}
.w-icon{width:64px;height:64px;background:var(--surface2);border:1px solid var(--border);
  border-radius:18px;display:flex;align-items:center;justify-content:center;
  color:var(--text);box-shadow:var(--shadow-md)}
.w-title{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.5px}
.w-sub{font-size:14.5px;color:var(--text2);line-height:1.6;max-width:300px}
.w-start{padding:10px 24px;background:var(--text);border:none;border-radius:24px;
  color:var(--bg);font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;
  font-family:inherit;transition:all .2s}
.w-start:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(255,255,255,.1)}

/* ── Input Area ────────────────────────────────────────────────────────────── */
.hidden{display:none!important}
#input-area{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  left:0;right:0;padding:0 20px;display:flex;flex-direction:column;align-items:center;
   pointer-events:none;z-index:15}
#image-preview{display:flex;gap:8px;padding:8px 0;pointer-events:auto;overflow-x:auto;
  max-width:820px;width:100%}
#image-preview.hidden{display:none}
.preview-item{position:relative;flex-shrink:0;width:64px;height:64px;border-radius:10px;
  overflow:hidden;border:1px solid var(--border)}
.preview-item img{width:100%;height:100%;object-fit:cover}
.preview-item .preview-remove{position:absolute;top:2px;right:2px;width:18px;height:18px;
  background:rgba(0,0,0,.7);border:none;border-radius:50%;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1}
#input-container{width:100%;max-width:800px;display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);border-radius:24px;
  padding:10px 14px;pointer-events:auto;box-shadow:var(--shadow-lg);
  transition:border-color .2s,box-shadow .2s;margin-bottom:env(safe-area-inset-bottom,0px);
  overflow:hidden}
#input-container:focus-within{border-color:var(--accent);box-shadow:var(--shadow-lg),0 0 0 3px var(--accent-d)}

.inline-think-btn{background:none;border:none;color:var(--text3);cursor:pointer;
  padding:8px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;position:relative}
.inline-think-btn:hover{color:var(--text);background:var(--surface2)}
.inline-think-btn.active{color:var(--accent);background:var(--accent-d)}
.mic-recording{color:#f05555!important;animation:mic-pulse 1s ease-in-out infinite}
@keyframes mic-pulse{0%,100%{opacity:1}50%{opacity:.4}}
.mic-timer{display:none;font-size:11px;font-weight:600;color:#f05555;position:absolute;
  top:-6px;right:-12px;background:var(--surface2);border:1px solid rgba(240,85,85,.4);
  border-radius:8px;padding:1px 4px;line-height:1.2;white-space:nowrap;pointer-events:none;
  animation:mic-pulse 1s ease-in-out infinite}
.mic-recording .mic-timer{display:block}
.mic-starting .mic-icon{opacity:.4}
.tts-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;
  border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0}
.tts-btn:hover{color:var(--text);background:var(--surface2)}
.tts-btn.tts-playing{color:var(--accent);animation:mic-pulse 1s ease-in-out infinite}

#msg-input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);
  font-size:15px;line-height:1.5;padding:8px 0;resize:none;max-height:160px;
  min-height:24px;font-family:inherit;margin-bottom:2px}
#msg-input::placeholder{color:var(--text3)}
#send-btn{width:36px;height:36px;background:var(--accent);border:none;border-radius:18px;
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .2s;margin-bottom:2px;box-shadow:0 2px 8px var(--accent-d)}
#send-btn:hover:not(:disabled){transform:scale(1.05);background:var(--accent-h)}
#send-btn:active:not(:disabled){transform:scale(.95)}
#send-btn:disabled{background:var(--surface3);color:var(--text4);cursor:not-allowed;box-shadow:none}

/* ── Memory Cards ──────────────────────────────────────────────────────────── */
.mem-card{padding:12px;background:var(--surface2);position:relative;border:1px solid var(--border);
  border-radius:12px;transition:border-color .2s;padding-right:34px}
.mem-card:hover{border-color:var(--text4)}
.mem-card:hover .mem-del-btn{display:flex}
.mem-cat{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:3px 6px;border-radius:5px;margin-bottom:6px}
.cat-personal{background:rgba(124,108,240,.15);color:var(--accent)}
.cat-preference{background:rgba(78,203,113,.15);color:var(--success)}
.cat-work{background:rgba(91,156,245,.15);color:#5b9cf5}
.cat-habit{background:rgba(168,85,247,.15);color:#c084fc}
.cat-general{background:rgba(113,113,122,.15);color:var(--text2)}
.mem-content{font-size:13.5px;color:var(--text);line-height:1.5;word-break:break-word}
.mem-date{font-size:11px;color:var(--text4);margin-top:6px}
.mem-empty{text-align:center;color:var(--text3);font-size:13px;padding:24px 12px;line-height:1.6}
.mem-del-btn{display:none;position:absolute;top:12px;right:10px;background:none;
  border:none;color:var(--text4);cursor:pointer;padding:4px;border-radius:4px;transition:all .2s}
.mem-del-btn:hover{color:var(--danger);background:rgba(224,85,85,.1)}

/* ── Confirm Modal ─────────────────────────────────────────────────────────── */
#confirm-modal{position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;padding:20px}
#confirm-modal.open{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);
  backdrop-filter:blur(6px)}
.modal-box{position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:28px;max-width:440px;width:100%;
  box-shadow:var(--shadow-lg);animation:modalIn .25s ease-out}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}}
.modal-icon{color:var(--text2);margin-bottom:16px;background:var(--surface2);
  width:56px;height:56px;display:flex;align-items:center;justify-content:center;
  border-radius:14px;border:1px solid var(--border)}
.modal-title{font-size:18px;font-weight:700;margin-bottom:20px;color:var(--text)}
.modal-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.modal-field label{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--text3)}
.modal-field .val{font-size:14px;color:var(--text);background:var(--surface2);
  border:1px solid var(--border);border-radius:10px;padding:12px;
  white-space:pre-wrap;word-break:break-word;max-height:120px;overflow-y:auto;line-height:1.5}
.modal-field .val-input{font:inherit;font-size:14px;color:var(--text);background:var(--surface2);
  border:1px solid var(--border);border-radius:10px;padding:12px;width:100%;box-sizing:border-box;
  line-height:1.5;resize:vertical}
.modal-field .val-input:focus{outline:none;border-color:var(--accent)}
.modal-warn{font-size:13px;color:var(--text2);margin-bottom:24px;padding:12px 14px;
  background:rgba(224,85,85,.08);border:1px solid rgba(224,85,85,.2);border-radius:10px;
  display:flex;gap:8px;align-items:flex-start}
.modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}
.modal-cancel{padding:10px 20px;background:transparent;border:1px solid var(--border);
  border-radius:10px;color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:all .2s}
.modal-cancel:hover{background:var(--surface2);color:var(--text)}
.modal-confirm{padding:10px 24px;background:var(--text);border:none;border-radius:10px;
  color:var(--bg);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.modal-confirm:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,255,255,.1)}
.modal-confirm.danger{background:var(--danger);color:#fff}
.modal-confirm.danger:hover{background:#c94444;box-shadow:0 4px 12px rgba(224,85,85,.2)}

/* ── Settings Modal ────────────────────────────────────────────────────────── */
#settings-modal{position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;padding:20px}
#settings-modal.open{display:flex}
.settings-box{position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:28px;max-width:520px;width:100%;max-height:85vh;
  overflow-y:auto;box-shadow:var(--shadow-lg);animation:modalIn .25s ease-out}
.settings-title{font-size:18px;font-weight:700;margin-bottom:20px;color:var(--text);
  display:flex;align-items:center;gap:10px}
.settings-title svg{color:var(--accent)}
.settings-restart-notice{font-size:12px;color:var(--text3);padding:10px 14px;
  background:rgba(224,165,50,.08);border:1px solid rgba(224,165,50,.2);border-radius:10px;
  margin-bottom:16px;display:none}
.settings-section{margin-bottom:20px}
.settings-section-title{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--text4);margin-bottom:10px;padding:0 2px;
  display:flex;align-items:center;gap:8px}
.settings-section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.settings-section-inner{display:flex;flex-direction:column;gap:2px}
.setting-item{background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:10px 14px;transition:border-color .2s}
.setting-item:hover{border-color:var(--text4)}
.setting-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:center}
.setting-label .val-display{font-size:11px;color:var(--accent);font-weight:700;
  background:var(--accent-d);padding:2px 8px;border-radius:6px}
.setting-input{width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text);font-size:13px;font-family:inherit;
  transition:border-color .2s;outline:none}
.setting-input:focus{border-color:var(--accent)}
.setting-input[type=text]{padding:8px 10px}
.setting-input[type=select],select.setting-input{padding:8px 10px;cursor:pointer}
.setting-input[type=range]{padding:0;height:4px;-webkit-appearance:none;appearance:none;
  background:var(--surface3);border:none;border-radius:2px;cursor:pointer;margin:8px 0}
.setting-input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;
  box-shadow:0 0 8px var(--accent-d);transition:box-shadow .2s}
.setting-input[type=range]::-webkit-slider-thumb:hover{box-shadow:0 0 14px var(--accent-d)}
.setting-hint{font-size:11px;color:var(--text4);margin-top:4px}
.settings-appearance{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px;
  padding:14px 16px;background:var(--surface2);border:1px solid var(--border);
  border-radius:12px}
.settings-appearance .appearance-group{flex:1;min-width:140px}
.settings-appearance .appearance-group label{display:block;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;color:var(--text4);margin-bottom:6px}
.theme-grid{display:flex;gap:6px;flex-wrap:wrap}
.theme-swatch{width:28px;height:28px;border-radius:8px;border:2px solid transparent;
  cursor:pointer;transition:all .2s;position:relative;display:flex;align-items:center;justify-content:center}
.theme-swatch:hover{transform:scale(1.15)}
.theme-swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--bg),0 0 0 3px currentColor}
.theme-swatch::after{content:'';width:12px;height:12px;border-radius:50%;background:currentColor}
.lang-select{width:100%;padding:6px 10px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer}
.settings-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;
  padding-top:14px;border-top:1px solid var(--border)}
.settings-save{padding:10px 24px;background:var(--accent);border:none;border-radius:10px;
  color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.settings-save:hover{background:var(--accent-h);transform:translateY(-1px)}

/* ── Overlay & Toast ───────────────────────────────────────────────────────── */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  backdrop-filter:blur(3px);z-index:50}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);
  opacity:0;background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:12px 24px;border-radius:30px;font-size:14px;font-weight:500;z-index:300;
  transition:all .3s cubic-bezier(.4,0,.2,1);white-space:nowrap;box-shadow:var(--shadow-lg)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.err{border-color:rgba(224,85,85,.4);color:#fca5a1;background:#2a0f0f}

/* ── Responsive ────────────────────────────────────────────────────────────── */
@media(min-width:769px){
  body.sidebar-closed #sidebar{transform:translateX(-100%)}
  body.sidebar-closed #main{margin-left:0}
  body.sidebar-closed #topbar-right-widgets{display:flex}
}
@media(max-width:768px){
  #sidebar{position:fixed;top:0;left:0;transform:translateX(-100%);width:280px}
  body.sidebar-mobile-open #sidebar{transform:translateX(0)}
  body.sidebar-mobile-open #overlay{display:block}
  #main{margin-left:0}
  #topbar{padding:0 14px}
  #messages{padding:66px 14px 130px}
  #input-area{padding:0 12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));position:absolute;left:0;right:0}
  #input-container{max-width:100%;width:100%;padding:8px 10px;gap:6px;border-radius:20px}
  #send-btn{width:34px;height:34px}
  #msg-input{font-size:15px;min-height:22px}
  .bubble{font-size:14px}
  .w-title{font-size:20px}
  body{font-size:14px}
  #topbar-right-widgets{display:flex}
  #top-ticker{display:none}
  .sess-item{padding:8px 8px}
  .settings-box{max-width:100%;max-height:85vh;padding:20px;margin:10px}
}

/* ── Frosted glass mode (toggleable from Settings) ────────────────────────── */
body.glass-mode{
  --surface:rgba(18,18,26,.52); --surface2:rgba(28,28,38,.42);
  --surface3:rgba(44,44,58,.38); --border:rgba(255,255,255,.1);
  --user-bg:rgba(30,30,42,.45);
  background:
    radial-gradient(1100px 750px at 8% -12%, rgba(240,148,58,.22), transparent 60%),
    radial-gradient(900px 700px at 108% 8%, rgba(77,159,245,.16), transparent 60%),
    radial-gradient(1000px 900px at 45% 118%, rgba(149,120,245,.2), transparent 62%),
    radial-gradient(700px 500px at 85% 60%, rgba(61,191,101,.08), transparent 55%),
    #0a0a0f;
  background-attachment:fixed;
}
body.glass-mode #sidebar,
body.glass-mode #input-container,
body.glass-mode .modal-box,
body.glass-mode .settings-box,
body.glass-mode .msg-group.user .bubble,
body.glass-mode .mem-card,
body.glass-mode .code-wrapper,
body.glass-mode .w-icon,
body.glass-mode .preview-item{
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
}
body.glass-mode .msg-group.user .bubble,
body.glass-mode .mem-card,
body.glass-mode .code-wrapper{box-shadow:0 8px 32px rgba(0,0,0,.35)}

body.glass-mode #sidebar{background:var(--surface)}
body.glass-mode #topbar{background:rgba(10,10,15,.45);border-bottom-color:var(--border)}

/* ── Toggle switch ────────────────────────────────────────────────────────── */
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch{position:relative;width:40px;height:22px;flex-shrink:0;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:var(--surface3);border:1px solid var(--border);
  border-radius:22px;transition:background .2s}
.switch .track::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;
  border-radius:50%;background:var(--text2);transition:transform .2s,background .2s}
.switch input:checked + .track{background:var(--accent-d)}
.switch input:checked + .track::after{transform:translateX(18px);background:var(--accent)}
</style>

</div>

// ── Markdown, LaTeX & Copy (local parser) ─────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function parseMath(s) {
  const dict = {
    '\\rightarrow': '\u2192', '\\leftarrow': '\u2190', '\\Rightarrow': '\u21D2', '\\Leftarrow': '\u21D0',
    '\\leftrightarrow': '\u2194', '\\Leftrightarrow': '\u21D4', '\\times': '\u00D7', '\\div': '\u00F7',
    '\\leq': '\u2264', '\\geq': '\u2265', '\\neq': '\u2260', '\\approx': '\u2248', '\\pm': '\u00B1',
    '\\cdot': '\u00B7', '\\infty': '\u221E', '\\Delta': '\u0394', '\\alpha': '\u03B1', '\\beta': '\u03B2',
    '\\theta': '\u03B8', '\\pi': '\u03C0', '\\sigma': '\u03C3', '\\sum': '\u2211', '\\prod': '\u220F', '\\sqrt': '\u221A'
  };
  return s.replace(/\\[a-zA-Z]+/g, m => dict[m] || m);
}

function inl(s){
  s = esc(s);
  s = s.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => { const safe=/^(https?:|mailto:)/i.test(u.trim()); return safe ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : `[${t}](${u})`; });
  return s;
}

function copyCode(btn) {
  const codeEl = btn.closest('.code-wrapper').querySelector('code');
  if(!codeEl) return;
  const textToCopy = codeEl.innerText;
  const onSuccess = () => {
    const label = btn.querySelector('.copy-label');
    if (label) {
      const originalText = label.textContent;
      label.textContent = t('copied');
      btn.style.color = 'var(--success)';
      setTimeout(() => { label.textContent = originalText; btn.style.color = ''; }, 2000);
    }
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(textToCopy).then(onSuccess).catch(err => console.error("Copy error:", err));
  } else {
    const textArea = document.createElement("textarea");
    textArea.value = textToCopy;
    textArea.style.position = "fixed"; textArea.style.left = "-999999px"; textArea.style.top = "-999999px";
    document.body.appendChild(textArea); textArea.focus(); textArea.select();
    try { document.execCommand('copy'); onSuccess(); } catch (err) { console.error("Clipboard fallback error:", err); }
    document.body.removeChild(textArea);
  }
}

function stripMarkdown(text){
  if(!text) return '';
  return text
    .replace(/```[\s\S]*?```/g, '')
    .replace(/`([^`]*)`/g, '$1')
    .replace(/\*{1,3}([^*]+)\*{1,3}/g, '$1')
    .replace(/_{1,3}([^_]+)_{1,3}/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/^[\-\*_]{3,}\s*$/gm, '')
    .replace(/^>\s*/gm, '')
    .replace(/^[\-\*\+]\s+/gm, '')
    .replace(/^\d+\.\s+/gm, '')
    .replace(/\|/g, ' ')
    .replace(/(?<!\w)[*_]{1,2}(?!\w)/g, '')
    .replace(/\n{3,}/g, '\n\n')
    .replace(/ {2,}/g, ' ')
    .trim();
}

function renderMd(raw){
  if(!raw) return '';
  const CB=[], IC=[], MATH=[];
  let s = raw;

  s = s.replace(/\$\$\n?([\s\S]*?)\n?\$\$/g, (_, math) => {
    MATH.push(`<div class="math-display">${parseMath(esc(math))}</div>`);
    return `___MATH_BLOCK_${MATH.length-1}___`;
  });
  s = s.replace(/\$([^\$\n]+)\$/g, (_, math) => {
    MATH.push(`<span class="math-inline">${parseMath(esc(math))}</span>`);
    return `___MATH_INLINE_${MATH.length-1}___`;
  });
  s = s.replace(/```([\w]*)\n?([\s\S]*?)```/g, (_, lang, code)=>{
    const displayLang = lang ? lang.toUpperCase() : 'CODE';
    CB.push(`
      <div class="code-wrapper">
        <div class="code-header">
          <span class="lang">${esc(displayLang)}</span>
          <button class="copy-btn" onclick="copyCode(this)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> <span class="copy-label">${t('copy')}</span>
          </button>
        </div>
        <pre><code>${esc(code.trimEnd())}</code></pre>
      </div>
    `);
    return `___CODE_BLOCK_${CB.length-1}___`;
  });
  s = s.replace(/`([^`\n]+)`/g, (_,code)=>{
    IC.push(`<code>${esc(code)}</code>`);
    return `___INLINE_CODE_${IC.length-1}___`;
  });

  const lines=s.split('\n'), out=[];
  let i=0, m;

  while(i<lines.length){
    const l=lines[i];
    if((m=l.match(/^(#{1,3}) (.*)/))){
      const n=m[1].length; out.push(`<h${n}>${inl(m[2])}</h${n}>`); i++; continue;
    }
    if((m=l.match(/^> (.*)/))){ out.push(`<blockquote>${inl(m[1])}</blockquote>`); i++; continue; }
    if((m=l.match(/^[-*] (.*)/))){
      const its=[];
      while(i<lines.length && (m=lines[i].match(/^[-*] (.*)/))){ its.push(`<li>${inl(m[1])}</li>`); i++; }
      out.push(`<ul>${its.join('')}</ul>`); continue;
    }
    if((m=l.match(/^\d+\. (.*)/))){
      const its=[];
      while(i<lines.length && (m=lines[i].match(/^\d+\. (.*)/))){ its.push(`<li>${inl(m[1])}</li>`); i++; }
      out.push(`<ol>${its.join('')}</ol>`); continue;
    }
    if(l.trim().startsWith('|')){
      const rows=[];
      while(i<lines.length && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      const isSep=r=>/^\|[-|: ]+\|?$/.test(r) && r.includes('-');
      const parseCells=(row,tag)=>{
        const inner=row.replace(/^\||\|$/g,'');
        return inner.split('|').map(c=>`<${tag}>${inl(c.trim())}</${tag}>`).join('');
      };
      if(rows.length>=2 && isSep(rows[1])){
        const head=`<thead><tr>${parseCells(rows[0],'th')}</tr></thead>`;
        const body=`<tbody>${rows.slice(2).map(r=>`<tr>${parseCells(r,'td')}</tr>`).join('')}</tbody>`;
        out.push(`<div class="table-wrapper"><table>${head}${body}</table></div>`);
      } else {
        const body=`<tbody>${rows.map(r=>`<tr>${parseCells(r,'td')}</tr>`).join('')}</tbody>`;
        out.push(`<div class="table-wrapper"><table>${body}</table></div>`);
      }
      continue;
    }
    if(!l.trim()){ out.push('<br>'); i++; continue; }
    out.push(`<p>${inl(l)}</p>`); i++;
  }

  let r=out.join('');
  IC.forEach((c,i)=>{ r=r.split(`___INLINE_CODE_${i}___`).join(c); });
  CB.forEach((c,i)=>{ r=r.split(`___CODE_BLOCK_${i}___`).join(c); });
  MATH.forEach((c,i)=>{
    r=r.split(`___MATH_BLOCK_${i}___`).join(c);
    r=r.split(`___MATH_INLINE_${i}___`).join(c);
  });
  return r;
}

let pendingImages = []; // [{name, base64, preview}]
let _pendingStream = null; // sid of the currently streaming response

function handleFiles(files){
  for(const f of files){
    if(!f.type.startsWith('image/')) continue;
    if(pendingImages.length >= 5){ toast('Max 5 images', true); break; }
    const reader = new FileReader();
    reader.onload = e => {
      const dataUrl = e.target.result;
      const base64 = dataUrl.split(',')[1];
      pendingImages.push({name: f.name, base64, preview: dataUrl});
      renderImagePreview();
    };
    reader.readAsDataURL(f);
  }
  document.getElementById('file-input').value = '';
}

function renderImagePreview(){
  const box = document.getElementById('image-preview');
  if(!pendingImages.length){ box.classList.add('hidden'); box.innerHTML=''; return; }
  box.classList.remove('hidden');
  box.innerHTML = pendingImages.map((img,i) =>
    `<div class="preview-item"><img src="${img.preview}" alt="${esc(img.name)}"><button class="preview-remove" onclick="removeImage(${i})">&times;</button></div>`
  ).join('');
}

function removeImage(i){
  pendingImages.splice(i,1);
  renderImagePreview();
}

// ── Voice Input ──────────────────────────────────────────────────────────────
// Two local STT engines, switchable from Settings > Speech Engine (STT):
//
// 1. gemma4 (default) — Gemma 4 E2B/E4B native audio via /v1/chat/completions
//    Pros: captures emotion, tone, context; no separate model download
//    Cons: slower (~5-15s on Raspberry Pi), less precise transcription
//    How: browser records WebM → ffmpeg converts to WAV 16kHz → Ollama input_audio
//
// 2. whisper — faster-whisper (local Whisper C++ port, tiny model ~75MB)
//    Pros: fast (~1-2s), very accurate transcription, lightweight
//    Cons: no emotion/tone detection, text-only output
//
// Fallback chain: chosen engine → alternate engine → Web Speech API (Google, NOT private)
// All processing stays local. Web Speech API is last resort only.
let voiceState = 'idle'; // idle | recording | transcribing
let mediaRecorder = null;
let audioChunks = [];
let voiceStream = null;
let voiceTimer = null;
let voiceCountdown = null;
const MAX_VOICE_SECONDS = 30;

function toggleVoice(){
  if(voiceState === 'recording') stopVoice();
  else if(voiceState === 'idle') startVoice();
}

function startVoice(){
  if(voiceState !== 'idle') return;

  if(!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'){
    toast(t('micHttps'), true);
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast(t('micNoEngine'), true);
    return;
  }

  navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
    if(voiceState !== 'idle') { stream.getTracks().forEach(t => t.stop()); return; }
    voiceStream = stream;
    audioChunks = [];

    const mimeTypes = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/mp4',
      'audio/mp4;codecs=mp4a.40.2',
      'audio/aac',
    ];
    let selectedMime = '';
    for(const mt of mimeTypes){
      if(MediaRecorder.isTypeSupported(mt)){ selectedMime = mt; break; }
    }
    if(!selectedMime){
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(SR){ startWebSpeechFallback(SR); return; }
      toast(t('micNoEngine'), true);
      stream.getTracks().forEach(t => t.stop());
      return;
    }

    try {
      mediaRecorder = new MediaRecorder(stream, {mimeType: selectedMime, audioBitsPerSecond: 128000});
    } catch(e){
      console.warn('MediaRecorder creation failed:', e);
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(SR){ startWebSpeechFallback(SR); return; }
      toast(t('micNoEngine'), true);
      stream.getTracks().forEach(t => t.stop());
      return;
    }

    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onerror = e => {
      console.warn('MediaRecorder error:', e.error);
      toast(t('transcribeErr'), true);
      resetVoice();
    };
    mediaRecorder.onstop = () => processRecording(selectedMime);
    voiceState = 'recording';
    document.getElementById('mic-btn').classList.add('mic-recording');
    haptic(50);
    mediaRecorder.start(1000);
    startVoiceTimer();
  }).catch(err => {
    console.warn('getUserMedia failed:', err);
    voiceState = 'idle';
    if(err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError'){
      if(location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'){
        toast(t('micHttps'), true);
      } else {
        toast(t('micDenied'), true);
      }
    } else {
      toast(t('transcribeErr'), true);
    }
  });
}

async function processRecording(mimeUsed){
  voiceStream.getTracks().forEach(t => t.stop());
  voiceStream = null;
  const blob = new Blob(audioChunks, {type: mimeUsed || 'audio/webm'});
  audioChunks = [];
  if(blob.size < 500){ resetVoice(); return; }

  voiceState = 'transcribing';
  showTranscribing();
  const el = document.getElementById('msg-input');
  const engine = config.stt_engine || 'whisper';

  const isWebM = (mimeUsed || '').includes('webm');
  const audioFile = isWebM ? 'recording.webm' : 'recording.mp4';
  const engines = engine === 'whisper'
    ? (isWebM ? ['/chat/transcribe', '/chat/transcribe-gemma4'] : ['/chat/transcribe-gemma4', '/chat/transcribe'])
    : (isWebM ? ['/chat/transcribe-gemma4', '/chat/transcribe'] : ['/chat/transcribe', '/chat/transcribe-gemma4']);

  const engineNames = {'/chat/transcribe': t('micTryingWhisper'), '/chat/transcribe-gemma4': t('micTryingGemma4')};

  for(const endpoint of engines){
    const label = engineNames[endpoint] || endpoint;
    document.getElementById('mic-timer').textContent = label;
    try {
      const fd = new FormData();
      fd.append('audio', blob, audioFile);
      const headers = {};
      const key = getApiKey();
      if(key) headers['X-API-Key'] = key;
      let url = API + endpoint;
      if(endpoint === '/chat/transcribe' || endpoint === '/chat/transcribe-gemma4') url += '?lang=' + encodeURIComponent(lang);
      const resp = await fetch(url, {method: 'POST', body: fd, headers});
      if(!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      if(!data.text || !data.text.trim()){
        console.warn(endpoint + ': empty transcription');
        continue;
      }
      el.value = data.text;
      el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px';
      resetVoice();
      // Auto-send if voice auto-send is enabled
      const autoSend = config.auto_send_on_voice === 'on';
      if(autoSend){
        lastInputWasVoice = true;
        setTimeout(() => sendMsg(), 50);
      }
      return;
    } catch(e) {
      console.warn(endpoint + ' failed:', e);
    }
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SpeechRecognition){
    if(!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'){
      toast(t('micHttps'), true);
      resetVoice();
      return;
    }
    document.getElementById('mic-timer').textContent = t('micTryingBrowser');
    startWebSpeechFallback(SpeechRecognition);
    return;
  }

  toast(t('transcribeErr'), true);
  resetVoice();
}

function showTranscribing(){
  const micBtn = document.getElementById('mic-btn');
  micBtn.classList.remove('mic-recording');
  micBtn.classList.add('mic-starting');
  const timer = document.getElementById('mic-timer');
  timer.style.display = 'block';
  timer.textContent = '...';
}

function startWebSpeechFallback(SpeechRecognition){
  const speechRec = new SpeechRecognition();
  speechRec.lang = lang === 'tr' ? 'tr-TR' : lang === 'en' ? 'en-US' : lang;
  speechRec.continuous = false;
  speechRec.interimResults = true;
  const el = document.getElementById('msg-input');
  let finalTranscript = el.value ? el.value + ' ' : '';

  speechRec.onresult = e => {
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const transcript = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalTranscript += transcript; else interim = transcript;
    }
    el.value = finalTranscript + interim;
    el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px';
  };

  speechRec.onend = () => resetVoice();
  speechRec.onerror = e => {
    console.warn('Web Speech API error:', e.error);
    if(e.error === 'not-allowed') toast(t('micDenied'), true);
    else toast(t('transcribeErr'), true);
    resetVoice();
  };

  voiceState = 'recording';
  document.getElementById('mic-btn').classList.add('mic-recording');
  speechRec.start();
  startVoiceTimer();
}

function stopVoice(){
  if(voiceState !== 'recording') return;
  clearInterval(voiceTimer);
  clearInterval(voiceCountdown);
  if(mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
}

function resetVoice(){
  voiceState = 'idle';
  clearInterval(voiceTimer);
  clearInterval(voiceCountdown);
  const micBtn = document.getElementById('mic-btn');
  micBtn.classList.remove('mic-recording', 'mic-starting');
  const timer = document.getElementById('mic-timer');
  timer.style.display = 'none';
  timer.textContent = '';
  if(voiceStream){ voiceStream.getTracks().forEach(t => t.stop()); voiceStream = null; }
  mediaRecorder = null; audioChunks = [];
}

function startVoiceTimer(){
  let remaining = MAX_VOICE_SECONDS;
  updateTimerDisplay(remaining);
  voiceTimer = setInterval(() => {
    remaining--;
    if(remaining <= 0){ stopVoice(); return; }
    updateTimerDisplay(remaining);
  }, 1000);
}

function updateTimerDisplay(sec){
  const timer = document.getElementById('mic-timer');
  timer.textContent = sec;
}

// ── TTS (Text-to-Speech) ────────────────────────────────────────────────────
// Two engines, switchable from Settings > Speech Engine (TTS):
//
// 1. piper (default) — Piper TTS local .onnx models
//    Pros: consistent quality, fully offline, privacy-safe
//    Cons: limited voice selection, requires model download (~50MB each)
//
// 2. browser — Web Speech API (speechSynthesis)
//    Pros: many voices, no model download, fast
//    Cons: sends text to Google/Apple servers (privacy risk), quality varies

let ttsAudio = null;
let ttsBtn = null;

async function toggleTTS(text, btn){
  // Stop if already playing
  if(ttsBtn === btn){
    stopTTS();
    return;
  }
  stopTTS();
  ttsBtn = btn;
  const engine = (_settingsData.TTS_ENGINE && _settingsData.TTS_ENGINE.value) || 'piper';

  if(engine === 'browser'){
    playBrowserTTS(text, btn);
  } else {
    await playPiperTTS(text, btn);
  }
}

function playBrowserTTS(text, btn){
  if(!('speechSynthesis' in window)){ toast(t('ttsErr'), true); resetTTS(); return; }
  const utt = new SpeechSynthesisUtterance(stripMarkdown(text).slice(0, 2000));
  utt.lang = lang === 'tr' ? 'tr-TR' : lang === 'en' ? 'en-US' : lang;
  utt.rate = 1;
  const voices = speechSynthesis.getVoices();
  const match = voices.find(v => v.lang.startsWith(lang)) || voices.find(v => v.lang.startsWith('en'));
  if(match) utt.voice = match;
  utt.onstart = () => { if(ttsBtn) ttsBtn.classList.add('tts-playing'); };
  utt.onend = () => { if(ttsBtn) ttsBtn.classList.remove('tts-playing'); ttsBtn = null; };
  utt.onerror = () => { toast(t('ttsErr'), true); resetTTS(); };
  speechSynthesis.speak(utt);
}

async function playPiperTTS(text, btn){
  try {
    const voice = (_settingsData.TTS_VOICE && _settingsData.TTS_VOICE.value) || '';
    const headers = {'Content-Type':'application/json'};
    const key = getApiKey();
    if(key) headers['X-API-Key'] = key;
    const r = await fetch(API + '/chat/tts', {method:'POST', headers,
      body: JSON.stringify({text: text.slice(0, 2000), voice})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const blob = await r.blob();
    ttsAudio = new Audio(URL.createObjectURL(blob));
    ttsAudio.onplay = () => { if(ttsBtn) ttsBtn.classList.add('tts-playing'); };
    ttsAudio.onended = () => { if(ttsBtn) ttsBtn.classList.remove('tts-playing'); ttsBtn = null; };
    ttsAudio.onerror = () => { toast(t('ttsErr'), true); resetTTS(); };
    ttsAudio.play().catch(() => { toast(t('ttsErr'), true); resetTTS(); });
  } catch(e) {
    toast(t('ttsErr'), true);
    resetTTS();
  }
}

function stopTTS(){
  // Stop Piper (Audio element)
  if(ttsAudio && ttsAudio.src){
    ttsAudio.pause(); ttsAudio.currentTime = 0; ttsAudio = null;
  }
  // Stop browser TTS
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(ttsBtn) ttsBtn.classList.remove('tts-playing');
  ttsBtn = null;
}

function resetTTS(){
  stopTTS();
}

// ── API Communication ───────────────────────────────────────────────────────────
const API = window.location.origin;

function getApiKey(){ return localStorage.getItem('ps_api_key') || ''; }
function setApiKey(k){ localStorage.setItem('ps_api_key', k); }

async function api(method, path, body){
  const headers = {'Content-Type':'application/json'};
  const key = getApiKey();
  if(key) headers['X-API-Key'] = key;
  const opts = {method, headers};
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(API+path, opts);
  if(r.status === 401){
    if(!key && !window._authPrompted){
      window._authPrompted = true;
      const newKey = prompt(t('apiKeyPrompt'));
      if(newKey){
        setApiKey(newKey);
        headers['X-API-Key'] = newKey;
        const r2 = await fetch(API+path, {method, headers, body: opts.body});
        if(r2.ok) return r2.json();
      }
    }
    if(key) setApiKey('');
    throw new Error('HTTP 401');
  }
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

// ── Message Sending ─────────────────────────────────────────────────────────────
function createStreamBubble(){
  hideTyping();
  const g=document.createElement('div'); g.className='msg-group assistant';
  g.innerHTML=`<div class="msg-meta"><span class="who">piSynapse</span><span class="ts">${timeNow()}</span></div><div class="bubble"></div>`;
  document.getElementById('messages').appendChild(g); scrollEnd(true); return g.querySelector('.bubble');
}

async function sendMsg(){
  if(loading) return; const el=document.getElementById('msg-input'); const text=el.value.trim();
  const images=pendingImages.map(i=>i.base64);
  if(!text && !images.length) return; if(!currentSid) currentSid=newSid();
  const sid = currentSid;
  _pendingStream = { sid };
  el.value=''; el.style.height='auto'; pendingImages=[]; renderImagePreview();
  addMsg('user',text,true,null,images); showTyping(); setLoading(true);
  let bubble=null, fullText='';
  try{
    const headers={'Content-Type':'application/json'};
    const _k=getApiKey(); if(_k) headers['X-API-Key']=_k;
    const resp=await fetch(API+'/chat/stream',{ method:'POST', headers,
      body:JSON.stringify({ message: text, session_id: sid, user_id: config.username||'default', think_mode: thinkMode, images })
    });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const reader=resp.body.getReader(), dec=new TextDecoder(); let buf='';
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); const lines=buf.split('\n'); buf = lines.pop() || '';
      for(const rawLine of lines){
        const line = rawLine.trim(); if(!line || !line.startsWith('data: ')) continue;
        let data; try{ data=JSON.parse(line.slice(6)); } catch{ continue; }
        if('token' in data){
          if(currentSid !== sid) continue; // user navigated away, skip rendering
          if(!bubble) bubble=createStreamBubble();
          fullText+=data.token; bubble.innerHTML=renderMd(fullText); scrollEnd(false);
        } else if(data.confirm){
          hideTyping(); showConfirmModal(data.confirm); setLoading(false); _pendingStream=null; return;
        } else if(data.error){
          hideTyping(); if(bubble) bubble.textContent='\u26A0\uFE0F '+data.error; else addMsg('assistant','\u26A0\uFE0F '+data.error);
          toast(t('connErr'),true); setLoading(false); _pendingStream=null; return;
        } else if(data.done){
          if(currentSid === sid){
            await saveSessionName(text);
          }
          await loadSessions();
          // Don't reload the session — the stream bubble already has the full text.
          // Reloading calls clearMsgs()+DOM rebuild, which causes a visible flash.
          // If the user navigated away during streaming, loadSessions() updates the sidebar.
        }
      }
    }
  } catch{
    if(currentSid === sid){
      hideTyping(); if(bubble) bubble.textContent='\u26A0\uFE0F '+t('connErr'); else addMsg('assistant','\u26A0\uFE0F '+t('connErr')); toast(t('connErr'),true);
    }
  } finally{
    if(_pendingStream?.sid === sid) _pendingStream=null;
    if(currentSid === sid){
      // Add TTS button to streamed bubble (createStreamBubble doesn't add one)
      if(bubble && fullText){
        const group = bubble.closest('.msg-group');
        if(group && !group.querySelector('.tts-btn')){
          const meta = group.querySelector('.msg-meta');
          if(meta){
            const ttsBtn=document.createElement('button');
            ttsBtn.className='tts-btn';
            ttsBtn.title='Listen';
            ttsBtn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>';
            ttsBtn.onclick=()=>toggleTTS(fullText, ttsBtn);
            meta.appendChild(ttsBtn);
          }
        }
      }
      setLoading(false); el.focus();
      // Auto-speak response if voice input + auto-TTS enabled
      if(lastInputWasVoice && config.auto_tts_on_voice === 'on' && fullText){
        lastInputWasVoice = false;
        const ttsBtnEl = document.querySelector('.msg-group.assistant:last-child .tts-btn');
        if(ttsBtnEl) toggleTTS(fullText, ttsBtnEl);
      }
      lastInputWasVoice = false;
    }
  }
}

async function saveSessionName(firstMsg){
  const cached=sessionList.find(s=>s.session_id===currentSid);
  if(!cached?.name){
    const name=firstMsg.slice(0,38)+(firstMsg.length>38?'\u2026':'');
    try{
      await api('PATCH',`/chat/sessions/${encodeURIComponent(currentSid)}`,{name});

      if(cached) cached.name=name; else sessionList.unshift({session_id:currentSid,name,last_active:new Date().toISOString()});
      renderSessions(sessionList);
    } catch {}
  }
}

function mField(label, value){ return `<div class="modal-field"><label>${esc(label)}</label><div class="val">${esc(value)}</div></div>`; }
function mInput(label, value, pkey, multiline){
  if(multiline) return `<div class="modal-field"><label>${esc(label)}</label><textarea class="val-input" data-p="${esc(pkey)}" rows="3">${esc(value)}</textarea></div>`;
  return `<div class="modal-field"><label>${esc(label)}</label><input class="val-input" data-p="${esc(pkey)}" value="${esc(value)}"></div>`;
}
function cancelAction(){ document.getElementById('confirm-modal').classList.remove('open'); pendingAction=null; }

async function confirmAction(){
  if(!pendingAction) return; document.getElementById('confirm-modal').classList.remove('open');
  const tool = pendingAction.tool, params = pendingAction.params;
  document.querySelectorAll('#m-fields .val-input').forEach(inp=>{ params[inp.dataset.p]=inp.value; });
  pendingAction=null;
  if(tool === 'delete_session') {
    try { await api('DELETE','/chat/history?session_id='+encodeURIComponent(params.sid));
      sessionList=sessionList.filter(s=>s.session_id!==params.sid);
      if(currentSid===params.sid){ currentSid=null; clearMsgs(); showWelcome(); } renderSessions(sessionList);
    } catch { toast(t('delErr'),true); } return;
  }
  if(tool === 'delete_memory') {
    try { const uid=config.username||'default'; await api('DELETE', `/chat/memories?user_id=${encodeURIComponent(uid)}&id=${encodeURIComponent(params.id)}`); await loadMem(); } catch { toast(t('connErr'),true); } return;
  }
  showTyping(); setLoading(true);
  try{
    const d=await api('POST','/chat/execute',{ session_id:currentSid, user_id:config.username||'default', tool:tool, params:params });
    hideTyping(); addMsg('assistant',d.reply); await loadSessions();
  } catch{ hideTyping(); addMsg('assistant','\u26A0\uFE0F '+t('connErr')); toast(t('connErr'),true); } finally{ setLoading(false); }
}

// ── Memory Panel ────────────────────────────────────────────────────────────────
function toggleMem(){
  memOpen=!memOpen;
  const sessListEl = document.getElementById('session-list'), memSectionEl = document.getElementById('sidebar-mem-section'), memListEl = document.getElementById('sidebar-mem-list'), memBtnEl = document.getElementById('mem-toggle-btn');
  if(memOpen) {
    sessListEl.classList.add('compressed-list'); memSectionEl.style.display = 'block'; memListEl.style.display = 'flex'; memBtnEl.classList.add('active'); loadMem();
  } else {
    sessListEl.classList.remove('compressed-list'); memSectionEl.style.display = 'none'; memListEl.style.display = 'none'; memBtnEl.classList.remove('active');
  }
}

async function loadMem(){
  const list=document.getElementById('sidebar-mem-list'); list.innerHTML=`<div class="mem-empty">${t('loading')}</div>`;
  try{
    const uid=config.username||'default'; const d=await api('GET',`/chat/memories?user_id=${encodeURIComponent(uid)}`); const mems=d.memories||[];
    if(!mems.length){
      list.innerHTML=`<div class="mem-empty"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--surface3)" stroke-width="2" stroke-linecap="round" style="margin-bottom:8px"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><br>${t('noMem')}<br><span style="font-size:11px;color:var(--text4);display:block;margin-top:4px">${t('noMemNote')}</span></div>`;
      return;
    }
    list.innerHTML=mems.map(m=>{
      const cat=m.category||'general', mid=m.id || m.content;
      return `<div class="mem-card"><div class="mem-cat cat-${esc(cat)}">${esc(cat)}</div><div class="mem-content">${esc(m.content)}</div><div class="mem-date">${relTime(m.created_at)}</div><button class="mem-del-btn" onclick="triggerDelMemory('${esc(mid)}', '${esc(m.content)}')" title="${t('del')}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button></div>`;
    }).join('');
  } catch{ list.innerHTML=`<div class="mem-empty">${t('connErr')}</div>`; }
}
function triggerDelMemory(id, content) { showConfirmModal({ tool: 'delete_memory', params: { id: id, content: content } }); }

// ── Settings Panel ──────────────────────────────────────────────────────────────
let _settingsData = {};

const SETTINGS_GROUPS = {
  'Generation':  ['LLM_TEMPERATURE','LLM_TOP_P','LLM_TOP_K','LLM_NUM_CTX'],
  'Model':       ['LLM_MODEL','LLM_KEEP_ALIVE'],
  'Chat':        ['HISTORY_LIMIT','MEMORY_LIMIT','SUMMARY_BATCH_SIZE','SUMMARY_EARLY_TRIGGER'],
  'Voice':       ['TTS_VOICE','TTS_ENGINE','STT_ENGINE','AUTO_SEND_ON_VOICE','AUTO_TTS_ON_VOICE'],
  'Personal':    ['ASSISTANT_USER','MAIL_PROVIDER','DEFAULT_CITY'],
};

function _settingLabel(entry) {
  const lbl = entry.label || {};
  return lbl[lang] || lbl.tr || lbl.en || '';
}

function _renderSetting(key, entry) {
  const val = entry.value;
  const type = entry.type;
  const label = _settingLabel(entry);

  if (type === 'select' && entry.options) {
    let opts = '';
    for (const opt of entry.options) {
      const olbl = _settingLabel(opt);
      opts += `<option value="${esc(opt.value)}" ${opt.value === val ? 'selected' : ''}>${esc(olbl)}</option>`;
    }
    return `<div class="setting-item"><div class="setting-label"><span>${esc(label || key)}</span></div><select class="setting-input" id="si-${key}">${opts}</select></div>`;
  } else if (type === 'float' || type === 'int') {
    const min = entry.min ?? 0;
    const max = entry.max ?? 100;
    const step = entry.step ?? 1;
    return `<div class="setting-item"><div class="setting-label"><span>${esc(label || key)}</span><span class="val-display" id="sv-${key}">${esc(val)}</span></div><input type="range" class="setting-input" id="si-${key}" min="${min}" max="${max}" step="${step}" value="${esc(val)}" oninput="document.getElementById('sv-${key}').textContent=this.value"></div>`;
  } else {
    return `<div class="setting-item"><div class="setting-label"><span>${esc(label || key)}</span></div><input type="text" class="setting-input" style="padding:8px 10px" id="si-${key}" value="${esc(val)}"></div>`;
  }
}

async function openSettings(){
  document.getElementById('settings-modal').classList.add('open');
  const form = document.getElementById('settings-form');
  form.innerHTML = `<div style="text-align:center;padding:12px;color:var(--text3)">${t('loading')}</div>`;
  const notice = document.getElementById('settings-restart-notice');
  notice.style.display = 'none';

  // Sync appearance controls
  document.getElementById('lbl-theme-select').textContent = t('themeLabel');
  document.getElementById('lbl-lang-select').textContent = t('langLabel');
  const glassLabel = document.getElementById('lbl-glass-label');
  if(glassLabel) glassLabel.textContent = t('glassLabel');
  const glassToggle = document.getElementById('glass-toggle');
  if(glassToggle){ glassToggle.checked = glass; glassToggle.parentElement.parentElement.querySelector('span').textContent = glass ? t('glassHint') : ''; }
  document.getElementById('lang-select').value = lang;
  renderThemeGrid();

  try {
    _settingsData = await api('GET', '/config/settings');
    const keySet = new Set(Object.keys(_settingsData));
    let html = '';
    const usedKeys = new Set();

    for (const [sectionLabel, keys] of Object.entries(SETTINGS_GROUPS)) {
      const sectionKeys = keys.filter(k => keySet.has(k));
      if (!sectionKeys.length) continue;
      const items = sectionKeys.map(k => { usedKeys.add(k); return _renderSetting(k, _settingsData[k]); }).join('');
      html += `<div class="settings-section"><div class="settings-section-title">${sectionLabel}</div><div class="settings-section-inner">${items}</div></div>`;
    }

    // Render any uncategorized keys
    const remaining = Object.keys(_settingsData).filter(k => !usedKeys.has(k));
    if (remaining.length) {
      const items = remaining.map(k => _renderSetting(k, _settingsData[k])).join('');
      html += `<div class="settings-section"><div class="settings-section-title">Other</div><div class="settings-section-inner">${items}</div></div>`;
    }

    form.innerHTML = html;
  } catch {
    form.innerHTML = `<div style="text-align:center;padding:12px;color:var(--danger)">${t('connErr')}</div>`;
  }
}

function closeSettings(){ document.getElementById('settings-modal').classList.remove('open'); }

async function saveSettings(){
  const values = {};
  for (const key of Object.keys(_settingsData)) {
    const el = document.getElementById('si-' + key);
    if (el) values[key] = el.value;
  }

  try {
    const result = await api('PATCH', '/config/settings', { values });
    toast(t('settingsSaved'));
    if (result.restart_required && result.restart_required.length > 0) {
      document.getElementById('settings-restart-notice').style.display = 'block';
    }
    // Refresh config + settings data so TTS/STT engine changes take effect immediately
    try {
      config = await api('GET', '/config');
      const s = await api('GET', '/config/settings');
      if(s) Object.assign(_settingsData, s);
    } catch {}
    setTimeout(closeSettings, 800);
  } catch {
    toast(t('connErr'), true);
  }
}

// ── Ticker (Marquee) ────────────────────────────────────────────────────────────
async function startTicker(){
  await refreshTicker();
  setInterval(refreshTicker, 3_600_000);
  setInterval(rotateTicker,  8_000);
}

async function refreshTicker(){
  const sunCloudSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path><path d="M22 16.92v-.08a5 5 0 0 0-4.32-4.94A5.89 5.89 0 0 0 12 7.5a5.5 5.5 0 0 0-4.72 2.68A5.5 5.5 0 0 0 3 15.5a4.5 4.5 0 0 0 4.5 4.5h10a4.5 4.5 0 0 0 4.5-4.58z"></path></svg>`;
  const calendarSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>`;
  if(!window._tickerIcons) window._tickerIcons = { sun: sunCloudSvg, cal: calendarSvg };
  try{ const w=await api('GET','/widget/weather'); _cachedWeatherRaw=w.summary||null; _cachedWeatherSummary=_cachedWeatherRaw; } catch{_cachedWeatherRaw=null; _cachedWeatherSummary=null; }
  try{ const c=await api('GET','/widget/calendar'); _cachedEvents=c.events||[]; } catch{ _cachedEvents=null; }
  rebuildTickerFromCache();
}

function rebuildTickerFromCache(){
  const icons = window._tickerIcons || {};
  const infoSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
  tickerItems = [];
  if(_cachedWeatherRaw){
    const text = _cachedWeatherRaw.replace(/feels like/gi, t('feelsLike'));
    tickerItems.push({ icon: icons.sun||infoSvg, text });
  }
  if(_cachedEvents !== null){
    if(_cachedEvents.length){
      _cachedEvents.forEach(ev => tickerItems.push({ icon: icons.cal||infoSvg, text:`${ev.time} \u2014 ${ev.title}` }));
    } else {
      tickerItems.push({ icon: icons.cal||infoSvg, text: t('noEvents') });
    }
  }
  if(!tickerItems.length) tickerItems.push({ icon: infoSvg, text:'piSynapse \u2014 Memory Active' });
  tickerIdx = 0; showTickerItem(0);
}

function showTickerItem(idx){
  const item = tickerItems[idx] || tickerItems[0]; if(!item) return;
  const singleContent = `<div style="display:inline-flex;align-items:center;gap:8px;padding-left:8px;padding-right:30px;font-size:12.5px;color:var(--text2);">${item.icon} <span style="font-weight:500;">${item.text}</span></div>`;
  const botInner = document.getElementById('ticker-text-inner'); if(botInner) applySeamlessMarquee(botInner, singleContent);
  const topInner = document.getElementById('top-ticker-text-inner'); if(topInner) applySeamlessMarquee(topInner, singleContent);
}

function applySeamlessMarquee(element, singleHtml) {
  element.innerHTML = `<div class="marquee-content">${singleHtml}</div>`;
  const contentNode = element.querySelector('.marquee-content'); contentNode.style.animation = 'none';
  setTimeout(() => {
     const containerWidth = element.parentElement.offsetWidth, contentWidth = contentNode.firstElementChild.offsetWidth;
     if (contentWidth > containerWidth && containerWidth > 0) {
         contentNode.innerHTML = singleHtml + singleHtml;
         const duration = Math.max(10, contentWidth / 25); contentNode.style.animation = `marquee ${duration}s linear infinite`;
     } else { contentNode.innerHTML = singleHtml; }
  }, 30);
}

function rotateTicker(){
  if(tickerItems.length <= 1) return; tickerIdx = (tickerIdx + 1) % tickerItems.length;
  const tickers = [document.getElementById('ticker'), document.getElementById('top-ticker')];
  tickers.forEach(el => { if(el) el.style.opacity = '0'; });
  setTimeout(()=>{ showTickerItem(tickerIdx); tickers.forEach(el => { if(el) el.style.opacity = '1'; }); }, 400);
}

// ── Search / Compact ────────────────────────────────────────────
let _searchQuery = '';

function filterSessions(q){
  _searchQuery = q.toLowerCase().trim();
  if(!_searchQuery){ renderSessions(sessionList); return; }
  const filtered = sessionList.filter(s => sessName(s).toLowerCase().includes(_searchQuery));
  renderSessions(filtered);
}

function toggleCompact(){

function applyStagger(){

// ── Sidebar Controls ────────────────────────────────────────────────────────────
function toggleSidebar(){
  if(window.innerWidth <= 768) {
    const isMobileOpen = document.body.classList.toggle('sidebar-mobile-open'); document.getElementById('overlay').classList.toggle('show', isMobileOpen);
    if(!isMobileOpen && memOpen) toggleMem();
  } else {
    document.body.classList.toggle('sidebar-closed'); if(document.body.classList.contains('sidebar-closed') && memOpen) toggleMem();
  }
}
function closeSidebar(){
  document.body.classList.remove('sidebar-mobile-open'); document.getElementById('overlay').classList.remove('show'); if(memOpen) toggleMem();
}

// ── Utility Functions ───────────────────────────────────────────────────────────
function scrollEnd(force = false){ const e = document.getElementById('messages'); if (force || (e.scrollHeight - e.scrollTop - e.clientHeight < 150)) { e.scrollTop = e.scrollHeight; } }
function timeNow(){ return new Date().toLocaleTimeString(lang==='tr' ? 'tr-TR' : 'en-GB', {hour:'2-digit', minute:'2-digit'}); }
function relTime(ts){
  if(!ts) return '';
  // SQLite CURRENT_TIMESTAMP is UTC and may use a space separator — normalize to ISO-8601
  const iso = ts.endsWith('Z') ? ts : ts.replace(' ','T')+'Z';
  const d=Date.now()-new Date(iso).getTime();
  if(lang==='en'){ if(d<60000) return 'just now'; if(d<3600000) return Math.floor(d/60000)+'m'; if(d<86400000) return Math.floor(d/3600000)+'h'; return Math.floor(d/86400000)+'d'; }
  if(d<60000) return 'az \u00F6nce'; if(d<3600000) return Math.floor(d/60000)+'dk'; if(d<86400000) return Math.floor(d/3600000)+'sa'; return Math.floor(d/86400000)+'g';
}
let toastTimer; function toast(msg, err=false){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.toggle('err',err); el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'), 3000); }

// ── Sidebar Swipe Gesture (mobile) ────────────────────────────────
let _swipeStartX = 0, _swipeStartY = 0;
document.addEventListener('touchstart', e => {
  const touch = e.touches[0];
  _swipeStartX = touch.clientX;
  _swipeStartY = touch.clientY;
}, {passive: true});

document.addEventListener('touchmove', e => {
  if(window.innerWidth > 768) return;
  const touch = e.touches[0];
  const dx = touch.clientX - _swipeStartX;
  const dy = touch.clientY - _swipeStartY;
  if(Math.abs(dx) < 30 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  if(dx > 60 && !document.body.classList.contains('sidebar-mobile-open')){
    document.body.classList.add('sidebar-mobile-open');
    document.getElementById('overlay').classList.add('show');
  } else if(dx < -60 && document.body.classList.contains('sidebar-mobile-open')){
    closeSidebar();
  }
}, {passive: true});

// ── Hold-to-Record ────────────────────────────────────────────────
let _holdTimer = null;

function setupHoldToRecord(){
  const btn = document.getElementById('mic-btn');
  if(!btn) return;

  const start = (e) => {
    if(voiceState !== 'idle') return;
    e.preventDefault();
    _holdTimer = setTimeout(() => {
      _holdTimer = null;
      startVoice();
    }, 200);
  };

  const end = (e) => {
    if(_holdTimer){ clearTimeout(_holdTimer); _holdTimer = null; return; }
    if(voiceState === 'recording'){
      e.preventDefault();
      stopVoice();
    }
  };

  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('mouseleave', () => { if(_holdTimer){ clearTimeout(_holdTimer); _holdTimer = null; } });
  btn.addEventListener('touchstart', start, {passive: true});
  btn.addEventListener('touchend', end);
}

if(localStorage.getItem('ps_compact')) document.body.classList.add('sidebar-compact');

}
