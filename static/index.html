<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="piSynapse">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>piSynapse</title>
  <style>
    html,body{margin:0;height:100%;background:#0a0a0f;color:#e8e8ec;
      display:flex;align-items:center;justify-content:center;
      font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    .boot{text-align:center;padding:24px;max-width:420px}
    .boot .spin{width:28px;height:28px;border:3px solid #2a2a35;border-top-color:#f0943a;
      border-radius:50%;margin:0 auto 14px;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="boot">
    <div class="spin"></div>
    <div id="boot-msg">piSynapse yükleniyor…</div>
  </div>
  <script>
    (function () {
      var app = window.PiSynapse || (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.PiSynapse);
      location.replace(app ? 'app.html' : 'web.html');
    })();
  </script>
</body>
</html>
