name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 3.11 = the Pi target, 3.12 = current dev. The matrix is not cosmetic:
      # a Py3.12-only regression (sqlite3 INSERT rowcount = -1) shipped once
      # and was caught only on a 3.12 laptop — CI must see both.
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (pinned lock)
        # requirements-lock.txt is the single reproducible source — it already
        # pins pytest/pytest-asyncio/ruff, so no floating installs.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Syntax check
        run: python -m compileall -q main.py config.py install.py utils.py prompt.py db.py embedding.py mail.py calendar_ops.py nextcloud_notes.py nextcloud_tasks.py weather.py retrieval.py tool_verification.py llm routers tools

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit the pinned lock
        # Report-only for now: the baseline has not been triaged here, so a
        # hard gate could surprise-block on a known CVE. Promote to blocking
        # (drop continue-on-error) once the lock is verified clean.
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements-lock.txt
